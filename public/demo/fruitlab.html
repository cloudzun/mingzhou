(function(){
  "use strict";
  var DATA = JSON.parse(document.getElementById("payload").textContent);
  var state = { stage: DATA.stages[0] ? DATA.stages[0].id : null, ring: null };

  /* ---------- 极简 Markdown 渲染（离线自包含，不引外部库） ---------- */
  function esc(s){
    return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }
  function inline(s){
    s = esc(s);
    s = s.replace(/`([^`]+)`/g, function(_,c){ return "<code>"+c+"</code>"; });
    s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
    s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, function(_,t,u){
      return '<a href="'+u+'" target="_blank" rel="noopener">'+t+"</a>";
    });
    return s;
  }
  /* ---------- 长内容折叠 ----------
     页面默认给精简视图；超过阈值的块只露前段，其余收进「展开全文」。
     内容仍来自记录，只是详略由展示层控制，事实一览仍可展开核对。 */
  var COLLAPSE_THRESHOLD = 520;
  var COLLAPSE_PREVIEW   = 300;

  function collapseHtml(html, rawLen){
    if(!html || rawLen <= COLLAPSE_THRESHOLD) return html;
    var cut = html.indexOf("</p>", Math.max(0, COLLAPSE_PREVIEW - 80));
    if(cut < 0) cut = html.indexOf("</table>", Math.max(0, COLLAPSE_PREVIEW - 140));
    if(cut < 0) return html;
    cut += 4;
    var head = html.slice(0, cut);
    var rest = html.slice(cut);
    if(!rest.trim()) return html;
    return head +
      '<details class="more"><summary>展开全文（约 ' + rawLen + ' 字）</summary>' +
      '<div class="more-body">' + rest + '</div></details>';
  }

  function renderMd(src){
    if(!src) return "";
    var raw = toStudentVoice(String(src));
    return collapseHtml(renderMdCore(raw), raw.length);
  }

  function renderMdCore(src){
    if(!src) return "";
    src = toStudentVoice(String(src));
    var lines = String(src).replace(/\r\n/g,"\n").split("\n");
    var out = [], i = 0;

    function isTableRow(l){ return /^\s*\|.*\|\s*$/.test(l); }
    function isSep(l){ return /^\s*\|[\s:\-|]+\|\s*$/.test(l); }

    while(i < lines.length){
      var ln = lines[i];

      /* 代码块 */
      if(/^\s*```/.test(ln)){
        var buf = [];
        i++;
        while(i < lines.length && !/^\s*```/.test(lines[i])){ buf.push(lines[i]); i++; }
        i++;
        out.push("<pre><code>"+esc(buf.join("\n"))+"</code></pre>");
        continue;
      }

      /* 表格 */
      if(isTableRow(ln) && i+1 < lines.length && isSep(lines[i+1])){
        var head = ln.trim().replace(/^\||\|$/g,"").split("|").map(function(c){return inline(c.trim());});
        i += 2;
        var body = [];
        while(i < lines.length && isTableRow(lines[i])){
          body.push(lines[i].trim().replace(/^\||\|$/g,"").split("|").map(function(c){return inline(c.trim());}));
          i++;
        }
        var h = "<table><thead><tr>"+head.map(function(c){return "<th>"+c+"</th>";}).join("")+"</tr></thead><tbody>";
        h += body.map(function(r){
          return "<tr>"+r.map(function(c){return "<td>"+c+"</td>";}).join("")+"</tr>";
        }).join("");
        out.push(h+"</tbody></table>");
        continue;
      }

      /* 引用块 */
      if(/^\s*>/.test(ln)){
        var q = [];
        while(i < lines.length && /^\s*>/.test(lines[i])){
          q.push(lines[i].replace(/^\s*>\s?/,"")); i++;
        }
        out.push("<blockquote>"+renderMd(q.join("\n"))+"</blockquote>");
        continue;
      }

      /* 列表 */
      if(/^\s*([-*+]|\d+\.)\s+/.test(ln)){
        var ordered = /^\s*\d+\.\s+/.test(ln);
        var items = [];
        while(i < lines.length && /^\s*([-*+]|\d+\.)\s+/.test(lines[i])){
          items.push(lines[i].replace(/^\s*([-*+]|\d+\.)\s+/,"")); i++;
          /* 续行 */
          while(i < lines.length && /^\s{2,}\S/.test(lines[i]) && !/^\s*([-*+]|\d+\.)\s+/.test(lines[i])){
            items[items.length-1] += " " + lines[i].trim(); i++;
          }
        }
        var tag = ordered ? "ol" : "ul";
        out.push("<"+tag+">"+items.map(function(t){return "<li>"+inline(t)+"</li>";}).join("")+"</"+tag+">");
        continue;
      }

      /* 标题：## / ### / #### / ##### */
      if(/^\s*#{2,6}\s+/.test(ln)){
        var lvl = ln.match(/^\s*(#{2,6})\s+/)[1].length;
        var txt = ln.replace(/^\s*#{2,6}\s+/,"");
        var tag = lvl <= 3 ? "h5" : (lvl === 4 ? "h5" : "h5");
        out.push("<"+tag+' class="sub-h">'+inline(txt)+"</"+tag+">");
        i++; continue;
      }

      /* 分隔线 */
      if(/^\s*(---|\*\*\*)\s*$/.test(ln)){ out.push("<hr>"); i++; continue; }

      /* 空行 */
      if(!ln.trim()){ i++; continue; }

      /* 段落 */
      var p = [];
      while(i < lines.length && lines[i].trim() &&
            !/^\s*(```|>|#####|---|\*\*\*)/.test(lines[i]) &&
            !/^\s*([-*+]|\d+\.)\s+/.test(lines[i]) &&
            !isTableRow(lines[i])){
        p.push(lines[i].trim()); i++;
      }
      if(p.length) out.push("<p>"+inline(p.join(" "))+"</p>");
      else i++;
    }
    return out.join("\n");
  }

  /* ---------- 学生视角措辞转换 ----------
     源记录是面向授课者写的（含若干讲解口吻用词）。
     网站是学生端，渲染时统一转换，不改动源记录。 */
  var WORD_MAP = [
    [/\*\*讲解要点\*\*/g, "**这一步的关键**"],
    [/### 讲解要点/g, "### 这一步的关键"],
    [/讲解要点/g, "这一步的关键"],
    [/课堂讲解用/g, "给学生看"],
    [/讲课时要强调的点/g, "你要注意的点"],
    [/讲课时/g, "看的时候"],
    [/讲解用/g, "阅读用"],
    [/讲师/g, "你"],
    [/课堂/g, "学习"],
    [/备课/g, "复习"]
  ];
  function toStudentVoice(s){
    if(!s) return s;
    for(var i=0;i<WORD_MAP.length;i++){ s = s.replace(WORD_MAP[i][0], WORD_MAP[i][1]); }
    return s;
  }

  /* ---------- 工具 ---------- */
  function badgeCls(sem){
    if(sem === "pass") return "b-pass";
    if(sem === "fail") return "b-fail";
    if(sem === "unavailable" || sem === "requires-remote" ||
       sem === "not-run" || sem === "UNVERIFIED" || sem === "partial") return "b-na";
    return "b-info";
  }
  function stageById(id){
    for(var i=0;i<DATA.stages.length;i++) if(DATA.stages[i].id===id) return DATA.stages[i];
    return null;
  }
  function semLabel(sem){
    return {pass:"通过",fail:"FAIL",unavailable:"不可用",partial:"部分",
            "requires-remote":"需远端","not-run":"未跑",UNVERIFIED:"未验证",
            warn:"注意",info:"记录"}[sem] || sem;
  }

  /* ---------- 时间轴 ---------- */
  function renderTrack(){
    var el = document.getElementById("track");
    el.innerHTML = DATA.stages.map(function(s){
      var active = s.id === state.stage ? ' data-active="true"' : "";
      return '<button class="stop" data-stage="'+s.id+'"'+active+'>'+
        '<div class="dot"></div>'+
        '<div class="ver">'+esc(s.version)+'</div>'+
        '<div class="name">'+esc(s.id)+'</div>'+
        '<div class="tag">'+esc(s.tagline)+'</div>'+
      '</button>';
    }).join("");
    Array.prototype.forEach.call(el.querySelectorAll(".stop"), function(b){
      b.addEventListener("click", function(){
        state.stage = b.getAttribute("data-stage");
        state.ring = null;
        renderAll();
      });
    });
  }

  /* ---------- 跑道 ---------- */
  function renderLane(){
    var st = stageById(state.stage);
    document.getElementById("laneTitle").textContent = st.id + " 的八环";
    document.getElementById("laneNote").textContent =
      st.partial ? "轻量四环（非完整八环）" : (st.rings.length + " 环");

    var desc = "按 GStack 八环顺序推进；每一环结束必须留下可检查的文件。";
    if(st.partial){
      desc = "这一幕没有走完整八环，只跑轻量四环（spec → build/deploy → review+qa → ship）——因为需求已经清楚，风险不在需求理解，而在环境与流程。";
    }
    document.getElementById("laneDesc").innerHTML = esc(desc);

    var byRing = {};
    st.rings.forEach(function(r){ byRing[r.canonical_ring] = r; });

    var el = document.getElementById("rings");
    el.innerHTML = DATA.canonical_rings.map(function(cr){
      var r = byRing[cr.ring];
      var empty = !r;
      var active = state.ring === cr.ring ? ' data-active="true"' : "";
      var sem = "";
      if(r && r.gate_results && r.gate_results.length){
        sem = r.gate_results[0].semantic;
      }
      var badge = (sem && sem !== "info")
        ? '<span class="badge '+badgeCls(sem)+'">'+esc(semLabel(sem))+'</span>' : "";
      var synthTag = (r && r.synthetic)
        ? '<span class="badge b-synth">PRD 替代</span>' : "";
      var sk = (r && r.skill) ? r.skill : cr.skill;
      return '<button class="ring" data-ring="'+cr.ring+'"'+active+
        (empty?' data-empty="true"':'')+'>'+
        '<div class="n">第 '+cr.ring+' 环</div>'+
        '<div class="nm">'+esc(cr.zh)+'</div>'+
        '<div class="sk">'+esc(sk)+'</div>'+
        badge+synthTag+
      '</button>';
    }).join("");

    Array.prototype.forEach.call(el.querySelectorAll(".ring"), function(b){
      if(b.getAttribute("data-empty") === "true") return;
      b.addEventListener("click", function(){
        state.ring = parseInt(b.getAttribute("data-ring"),10);
        renderAll();
      });
    });
  }

  /* ---------- 详情 ---------- */
  function renderDetail(){
    var el = document.getElementById("detail");
    var st = stageById(state.stage);

    if(state.ring === null){
      /* 未选环：干净的阶段概览 —— 只有定位与入口，不放结论 */

      var promptBlock = "";
      if(st.prompt && st.prompt.body){
        promptBlock =
          '<div class="block wide prompt-block">'+
            '<h4>这一轮的起点：'+esc(st.prompt.kind)+'</h4>'+
            (st.prompt.title && st.prompt.title.indexOf(st.prompt.kind) === -1
             ? '<div class="prompt-title">'+inline(st.prompt.title)+'</div>' : '')+
            '<div class="md">'+renderMd(st.prompt.body)+'</div>'+
            '<div class="prompt-src">来源：'+esc(st.prompt.source)+'</div>'+
          '</div>';
      }

      var handoffBlock = "";
      if(st.handoff){
        handoffBlock =
          '<div class="block wide handoff-block">'+
            '<h4>从上一轮接着做</h4>'+
            '<div class="md">'+renderMd(st.handoff.body)+'</div>'+
          '</div>';
      }

      el.innerHTML = '<div class="detail">'+
        '<div class="dt-hd"><h3>'+esc(st.id)+' · '+esc(st.version)+'</h3></div>'+
        '<div class="dt-lead">'+esc(st.tagline)+'</div>'+
        '<div class="grid2">'+
          handoffBlock+
          promptBlock+
        '</div>'+
        '<div class="start-hint">'+
          '<span class="arrow">↓</span> 从上面跑道选一个环节开始看。'+
          '顺序是：需求诊断 → 规格定型 → 四方评审 → 受控施工 → 结构排雷 → 实机探索 → 发布 → 量化复盘。'+
        '</div>'+
        '<div class="roundup" id="roundup">'+
          '<div class="roundup-hd">这一轮的结果</div>'+
          (st.summary?'<div class="block wide"><h4>一句话总结</h4><div class="md">'+renderMd(st.summary)+'</div></div>':'')+
          (st.honest_list && st.honest_list.length ?
            '<div class="block wide"><h4>没做到的部分（如实记录）</h4>'+
            '<table class="honest"><thead><tr><th>项目</th><th>状态</th><th>原因</th></tr></thead><tbody>'+
            st.honest_list.map(function(h){
              return "<tr><td>"+inline(h.item)+'</td><td><span class="st '+badgeCls(h.semantic)+'">'+
                esc(h.status)+"</span></td><td>"+inline(h.reason)+"</td></tr>";
            }).join("")+"</tbody></table></div>" : '')+
          (st.extras?'<div class="block wide"><h4>补充材料</h4><div class="md">'+renderMd(st.extras)+'</div></div>':'')+
        '</div>'+
      '</div>';

      var rb = document.getElementById("roundup");
      if(rb){
        var btn = document.createElement("button");
        btn.className = "roundup-toggle";
        btn.textContent = "看完八环后展开这一轮的结果";
        btn.addEventListener("click", function(){
          var body = rb.querySelectorAll(".block");
          var open = rb.getAttribute("data-open") === "true";
          Array.prototype.forEach.call(body, function(b){ b.style.display = open ? "none" : ""; });
          rb.setAttribute("data-open", open ? "false" : "true");
          btn.textContent = open ? "看完八环后展开这一轮的结果" : "收起这一轮的结果";
        });
        rb.insertBefore(btn, rb.firstChild);
        var init = rb.querySelectorAll(".block");
        Array.prototype.forEach.call(init, function(b){ b.style.display = "none"; });
        rb.setAttribute("data-open", "false");
      }
      return;
    }

    /* 已选环 */
    var cr = null, r = null;
    for(var i=0;i<DATA.canonical_rings.length;i++){
      if(DATA.canonical_rings[i].ring === state.ring){ cr = DATA.canonical_rings[i]; break; }
    }
    r = st.rings.filter(function(x){ return x.canonical_ring === state.ring; })[0];
    if(!r){ el.innerHTML = '<div class="detail"><div class="empty">这一幕没有走第 '+state.ring+' 环。</div></div>'; return; }

    var gatesHtml = "";
    if(r.gate_results && r.gate_results.length){
      gatesHtml = '<div class="block wide"><h4>门禁实况</h4><div class="gates">'+
        r.gate_results.map(function(g){
          var txt = g.cells.join(" · ");
          return '<div class="gate"><span class="sem '+badgeCls(g.semantic)+'">'+
            esc(semLabel(g.semantic))+'</span><span class="txt">'+inline(txt)+"</span></div>";
        }).join("")+"</div></div>";
    }

    el.innerHTML = '<div class="detail">'+
      '<div class="dt-hd">'+
        '<h3>第 '+cr.ring+' 环 · '+esc(cr.zh)+'</h3>'+
        '<span class="skillset">'+esc(cr.skill)+'</span>'+
        '<span class="src">'+esc(st.id)+' · '+esc(r.label)+'</span>'+
      '</div>'+
      (r.lead ? '<div class="dt-lead md">'+renderMd(r.lead)+'</div>' : '')+
      (r.takeaway ? '<div class="keyline"><div class="keyline-hd">这一步的关键</div><div class="md">'+renderMd(r.takeaway)+'</div></div>' : '')+
      (r.source_note ? '<div class="src-note">本文内容取自 <code>'+esc(r.source_note)+'</code></div>' : '')+
      '<div class="grid2">'+
        (r.inputs ? '<div class="block"><h4>输入</h4><div class="md">'+renderMd(r.inputs)+'</div></div>' : '')+
        (r.analysis ? '<div class="block"><h4>需求分析与判断</h4><div class="md">'+renderMd(r.analysis)+'</div></div>' : '')+
        (r.decisions ? '<div class="block wide"><h4>决策与依据</h4><div class="md">'+renderMd(r.decisions)+'</div></div>' : '')+
        (r.gate_outputs ? '<div class="block wide"><h4>门禁与产出</h4><div class="md">'+renderMd(r.gate_outputs)+'</div></div>' : '')+
        gatesHtml+
        (r.extras ? '<div class="block wide"><h4>补充材料</h4><div class="md">'+renderMd(r.extras)+'</div></div>' : '')+
      '</div>'+
    '</div>';
  }

  function renderAll(){
    renderTrack();
    renderLane();
    renderDetail();
  }

  document.getElementById("genAt").textContent = "数据生成 " + DATA.generated_at;
  document.getElementById("footSrc").innerHTML =
    "内容来自 <code>" + esc(DATA.source_dir) + "</code> 下的记录文件，由 <code>build/extract.py</code> 自动抽取。" +
    "本页面为单文件离线版本，不依赖任何外部资源。";
  renderAll();
})();
</script>
</body>
